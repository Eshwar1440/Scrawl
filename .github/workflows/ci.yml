name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  webext-lint:
    name: web-ext lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npx --yes web-ext lint \
            --source-dir . \
            --ignore-files \
              "store-listing/**" \
              "teach/**" \
              "tasks/**" \
              "eslint.config.js" \
              "package.json" \
              "package-lock.json" \
              "*.md" \
              "LICENSE"
